name: Starter CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run check
      - run: bun run test
      - run: bun bin/starter.mjs ci-dry-run --yes --dry-run --i18n --mdc
      - run: npm pack --dry-run
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [none, nuxt-ui, shadcn, element, content, fullstack, mysql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U app -d app" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: app
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          MYSQL_ROOT_PASSWORD: local-root
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h localhost -plocal-root" --health-interval 5s --health-timeout 5s --health-retries 30
      redis-cache:
        image: redis:7-alpine
        ports: ['6379:6379']
      redis-state:
        image: redis:7-alpine
        ports: ['6380:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test:smoke ${{ matrix.scenario }}
