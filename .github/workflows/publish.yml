name: Publish to npm

# Heavy smoke checks ran on master. Release is an OIDC-only final gate.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify release version and successful master CI
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          if (pkg.name !== '@pepper_fm/nuxt-starter' || process.env.RELEASE_TAG !== 'v' + pkg.version) {
            console.error('Release tag and package.json version must match')
            process.exit(1)
          }
          NODE
          gh run list --workflow ci.yml --branch master --event push \
            --commit "$(git rev-parse HEAD)" --limit 15 --json conclusion \
            --jq 'any(.[]; .conclusion == "success")' | grep -qx true
      - run: npm install --global npm@^11
      - run: npm publish --access public --registry https://registry.npmjs.org
